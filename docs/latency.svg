<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>UMC22 device period per direction: shared vs exclusive mode</title>
  <rect x="0.5" y="0.5" width="719" height="209" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="24" y="36" font-size="15" font-weight="600" fill="#1f2328">UMC22 minimum device period, per direction</text>
  <text x="24" y="56" font-size="12" fill="#57606a">Measured with tools/probe on Windows 11 · lower is better</text>

  <!-- scale: 0..10 ms over 420 px, starting at x=250 -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="250" y1="72" x2="250" y2="170"/>
    <line x1="334" y1="72" x2="334" y2="170"/>
    <line x1="418" y1="72" x2="418" y2="170"/>
    <line x1="502" y1="72" x2="502" y2="170"/>
    <line x1="586" y1="72" x2="586" y2="170"/>
    <line x1="670" y1="72" x2="670" y2="170"/>
  </g>
  <g font-size="11" fill="#6e7781" text-anchor="middle">
    <text x="250" y="188">0</text><text x="334" y="188">2</text><text x="418" y="188">4</text>
    <text x="502" y="188">6</text><text x="586" y="188">8</text><text x="670" y="188">10 ms</text>
  </g>

  <!-- shared -->
  <text x="236" y="101" font-size="13" fill="#1f2328" text-anchor="end">WASAPI shared</text>
  <text x="236" y="117" font-size="11" fill="#57606a" text-anchor="end">FlexASIO, Windows apps</text>
  <rect x="250" y="88" width="420" height="26" rx="4" fill="#8c959f"/>
  <text x="662" y="106" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="end">10 ms (fixed)</text>

  <!-- exclusive -->
  <text x="236" y="145" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end">WASAPI exclusive</text>
  <text x="236" y="161" font-size="11" fill="#57606a" text-anchor="end">this driver</text>
  <rect x="250" y="132" width="126" height="26" rx="4" fill="#0969da"/>
  <text x="384" y="150" font-size="12.5" font-weight="600" fill="#0969da">3 ms</text>
</svg>
